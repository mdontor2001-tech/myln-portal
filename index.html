
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYLN Portal | Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
* {
  box-sizing: border-box;
}

:root {
  --primary: #0f766e;
  --primary-dark: #115e59;
  --primary-light: #ccfbf1;
  --background: #f1f5f9;
  --surface: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --border: #e2e8f0;
  --danger: #b91c1c;
  --radius: 14px;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: var(--background);
  color: var(--text);
  line-height: 1.6;
}

.card {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: clamp(18px, 3vw, 32px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
}

.logo {
  width: 54px;
  height: 54px;
  margin: 0 auto 12px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--primary);
  color: white;
  font-size: 25px;
  font-weight: bold;
}

h1 {
  color: var(--primary);
  line-height: 1.25;
}

h1,
.subtitle {
  text-align: center;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 28px;
}

section {
  margin-top: 24px !important;
  padding: 20px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-wrap: anywhere;
}

section h2 {
  margin-top: 0;
  padding-bottom: 10px;
  color: var(--primary-dark);
  font-size: 20px;
  border-bottom: 1px solid var(--border);
}

section h3 {
  margin-top: 0;
  font-size: 16px;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-weight: 600;
  font-size: 14px;
}

input,
select,
textarea {
  width: 100%;
  max-width: 100%;
  padding: 11px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  background: white;
  color: var(--text);
  font: inherit;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid var(--primary-light);
  border-color: var(--primary);
}

button {
  width: auto;
  max-width: 100%;
  padding: 11px 16px;
  margin-top: 10px;
  border: 0;
  border-radius: 9px;
  background: var(--primary);
  color: white;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s ease;
}

button:hover {
  background: var(--primary-dark);
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

form {
  max-width: 100%;
}

ul {
  padding-left: 22px;
}

li {
  margin-bottom: 10px;
}

table {
  display: block;
  max-width: 100%;
  overflow-x: auto;
  border-collapse: collapse;
  background: white;
  font-size: 14px;
}

th {
  background: #f0fdfa;
  color: var(--primary-dark);
}

th,
td {
  padding: 10px !important;
  border: 1px solid var(--border) !important;
  text-align: left;
  white-space: nowrap;
}

#message,
#dashboardError {
  margin-top: 16px;
  font-size: 14px;
}

#dashboardError {
  color: var(--danger);
}

.hint {
  color: var(--muted);
  font-size: 12px;
  margin-top: 20px;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 16px;
    border-radius: 14px;
  }

  section {
    padding: 14px;
  }

  section h2 {
    font-size: 18px;
  }

  button {
    max-width: 100%;
  }
}

/* MYLN Dashboard Header */
.dashboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.header-brand .logo {
  flex-shrink: 0;
  margin: 0;
}

.header-brand h1 {
  margin: 0;
  text-align: left;
  font-size: 24px;
}

.header-brand .subtitle {
  margin: 4px 0 0;
  text-align: left;
}

.dashboard-header > button {
  margin-top: 0;
}

/* Sidebar and main content */
#dashboardLayout {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 22px;
  align-items: start;
  margin-top: 20px;
}

#dashboardSidebar {
  padding: 18px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

#dashboardSidebar h3 {
  margin: 0 0 14px;
  color: var(--primary-dark);
}

#dashboardNav {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#dashboardNav button {
  width: 100%;
  margin: 0;
  text-align: left;
  background: transparent;
  color: var(--text);
  font-weight: 600;
}

#dashboardNav button:hover,
#dashboardNav button.active {
  background: var(--primary);
  color: #fff;
}

#dashboardContent {
  min-width: 0;
}

#dashboardContent > section:first-child {
  margin-top: 0 !important;
}

/* Student and mentor layout */
#dashboardLayout.no-sidebar {
  grid-template-columns: minmax(0, 1fr);
}

/* Mobile responsive */
@media (max-width: 760px) {
  #dashboardLayout {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }

  #dashboardNav {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  #dashboardSidebar {
    padding: 14px;
  }

  .header-brand h1 {
    font-size: 20px;
  }
}

/* Professional MYLN Dashboard Header */
.dashboard-header {
  position: relative;
  padding: 18px 20px;
  margin: -10px -10px 24px;
  border: 1px solid #dbeafe;
  border-radius: 16px;
  background: linear-gradient(135deg, #f0fdfa, #ffffff 70%);
  box-shadow: 0 4px 14px rgba(15, 118, 110, 0.06);
}

.header-brand {
  gap: 16px;
}

.header-brand .logo {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  box-shadow: 0 5px 12px rgba(15, 118, 110, 0.18);
}

.header-brand h1 {
  color: #115e59;
  font-size: clamp(20px, 2.5vw, 27px);
  font-weight: 800;
  letter-spacing: -0.5px;
}

.header-brand .subtitle {
  color: #64748b;
  font-size: 14px;
}

.dashboard-header > button {
  padding: 11px 20px;
  border-radius: 10px;
  background: #b91c1c;
  box-shadow: 0 3px 8px rgba(185, 28, 28, 0.12);
}

.dashboard-header > button:hover {
  background: #991b1b;
}

@media (max-width: 600px) {
  .dashboard-header {
    margin: 0 0 18px;
    padding: 15px;
  }

  .header-brand {
    gap: 11px;
  }

  .header-brand .logo {
    width: 46px;
    height: 46px;
  }

  .dashboard-header > button {
    width: 100%;
  }
}

/* Professional Sidebar */
#dashboardSidebar {
  position: sticky;
  top: 18px;
  padding: 20px 14px;
  background: linear-gradient(180deg, #f0fdfa, #ffffff);
  border: 1px solid #dbeafe;
  border-radius: 16px;
  box-shadow: 0 5px 18px rgba(15, 23, 42, 0.04);
}

#dashboardSidebar h3 {
  padding: 0 10px 14px;
  margin-bottom: 12px;
  color: #115e59;
  font-size: 15px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  border-bottom: 1px solid #dbeafe;
}

#dashboardNav {
  gap: 7px;
}

#dashboardNav button {
  display: flex;
  align-items: center;
  padding: 12px 13px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-size: 13px;
  transition: background 0.2s ease, color 0.2s ease,
    border-color 0.2s ease, transform 0.2s ease;
}

#dashboardNav button:hover {
  background: #ccfbf1;
  color: #115e59;
  border-color: #99f6e4;
  transform: translateX(2px);
}

#dashboardNav button.active {
  background: #0f766e;
  color: #ffffff;
  border-color: #0f766e;
  box-shadow: 0 4px 10px rgba(15, 118, 110, 0.15);
}

@media (max-width: 760px) {
  #dashboardSidebar {
    position: static;
    padding: 14px;
  }

  #dashboardNav button {
    padding: 10px;
    font-size: 12px;
    transform: none;
  }
}

/* Student Profile Cards */
.student-profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}

.student-profile-item {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(135deg, #f0fdfa, #ffffff);
}

.student-profile-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.student-profile-value {
  color: var(--primary-dark);
  font-size: 16px;
  overflow-wrap: anywhere;
}

@media (max-width: 500px) {
  .student-profile-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Student Attendance Table */
.attendance-table-wrapper {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
}

.attendance-table-wrapper table {
  width: 100%;
  margin: 0;
  border: 0;
  border-collapse: collapse;
}

.student-attendance-table th,
.student-attendance-table td {
  padding: 12px !important;
  border-bottom: 1px solid var(--border) !important;
  white-space: normal;
  vertical-align: top;
}

.student-attendance-table th {
  background: #f0fdfa;
}

.student-attendance-table .attendance-status {
  font-weight: 700;
  text-transform: capitalize;
}

.student-attendance-table .attendance-status.present {
  color: #15803d;
}

.student-attendance-table .attendance-status.absent {
  color: #b91c1c;
}

.student-attendance-table .attendance-status.late {
  color: #b45309;
}

@media (max-width: 500px) {
  .student-attendance-table th,
  .student-attendance-table td {
    padding: 9px !important;
    font-size: 13px;
  }
}

/* Mentor Dashboard - Assigned Students */
.mentor-students-section {
  background: linear-gradient(135deg, #f0fdfa, #ffffff 65%);
}

.mentor-students-section ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.mentor-students-section ul li {
  margin: 0;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #ffffff;
  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
  overflow-wrap: anywhere;
}

@media (max-width: 500px) {
  .mentor-students-section ul {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Mentor Attendance Form */
.mentor-attendance-form {
  max-width: 560px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: linear-gradient(135deg, #f0fdfa, #ffffff);
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
}

.mentor-attendance-form select,
.mentor-attendance-form input,
.mentor-attendance-form textarea {
  width: 100%;
  min-height: 44px;
  border-radius: 10px;
}

.mentor-attendance-form button {
  width: 100%;
  min-height: 44px;
}

.mentor-attendance-form button:hover {
  transform: translateY(-1px);
}

@media (max-width: 500px) {
  .mentor-attendance-form {
    padding: 14px;
  }
}

  </style>
</head>

dashboardNav.addEventListener("click", function (event) {
  const button = event.target.closest("button[data-section]");

  if (!button) return;

  const target = document.getElementById(button.dataset.section);

  if (!target) {
    console.warn("Dashboard section not found:", button.dataset.section);
    return;
  }

  dashboardNav.querySelectorAll("button").forEach(function (item) {
    item.classList.toggle("active", item === button);
  });

  target.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

function updateActiveNavigation() {
  const sections = dashboardNav.querySelectorAll("button[data-section]");

  let activeSection = null;
  let smallestDistance = Infinity;

  sections.forEach(function (button) {
    const section = document.getElementById(button.dataset.section);

    if (!section) return;

    const distance = Math.abs(section.getBoundingClientRect().top - 120);

    if (section.getBoundingClientRect().top <= 180 && distance < smallestDistance) {
      smallestDistance = distance;
      activeSection = button;
    }
  });

  if (!activeSection) return;

  sections.forEach(function (button) {
    button.classList.toggle("active", button === activeSection);
  });
}

      record => record.status === "present"

      ? 0

      "repeat(auto-fit, minmax(140px, 1fr))";

      card.style.borderRadius = "10px";

      card.append(heading, number);
      grid.appendChild(card);
    });

    addText("h2", "Overall Attendance Statistics", statsSection);
    statsSection.appendChild(grid);

  } catch (error) {
    console.error("Attendance statistics error:", error);
    statsMessage.textContent =
      "Could not load statistics: " + error.message;
  }
}

          mentorAttendanceMessage.textContent =
            error.code === "23505"
              ? "Attendance already marked for this student today."
              : "Error: " + error.message;
          mentorAttendanceMessage.style.color = "#b91c1c";
        } finally {
          mentorAttendanceButton.disabled = false;
        }

      });

      mentorAttendanceSection.appendChild(mentorAttendanceForm);
    }
  }
}
      document.getElementById("logoutButton").addEventListener(
        "click", async () => {
          const { error: logoutError } = await client.auth.signOut();

          if (logoutError) {
            alert(logoutError.message);
            return;
          }

          window.location.reload();
        }
      );

    } catch (error) {
      message.textContent = error.message || "Login failed.";
      message.style.color = "#b91c1c";
    } finally {
      const currentButton = document.getElementById("loginButton");
      if (currentButton) {
        currentButton.disabled = false;
        currentButton.textContent = "Login";
      }
    }
  });
